[profile.default]
src = "src"
out = "forge-out"
libs = ["node_modules", "lib"]
test = "test/foundry"
cache_path = "cache/forge"
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
remappings_location = "remappings.txt"

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 64
depth = 32
fail_on_revert = false
